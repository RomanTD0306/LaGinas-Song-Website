<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Instagram Post – LaGina Sharp Davis</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .hint {
      color: #888;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      max-width: 620px;
      line-height: 1.6;
    }

    /* 1080×1080 Instagram square */
    .post {
      width: 1080px;
      height: 1350px;
      position: relative;
      overflow: hidden;
      display: block;
    }

    /* Full-bleed photo */
    .bg-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Dark gradient rising from the bottom */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.88) 0%,
        rgba(0, 0, 0, 0.55) 38%,
        rgba(0, 0, 0, 0.05) 65%,
        transparent 100%
      );
    }

    /* Bottom text block */
    .text-block {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 72px 72px;
      text-align: left;
    }

    .announcement {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #d4af37;
      margin: 0 0 16px 0;
    }

    .name {
      font-size: 68px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.05;
      margin: 0 0 8px 0;
      letter-spacing: -1px;
      font-family: Georgia, serif;
    }

    .tagline {
      font-size: 26px;
      color: rgba(255,255,255,0.7);
      margin: 0 0 36px 0;
      letter-spacing: 1px;
      font-style: italic;
      font-family: Georgia, serif;
    }

    /* Divider line */
    .divider {
      width: 80px;
      height: 3px;
      background: #d4af37;
      margin-bottom: 30px;
      border-radius: 2px;
    }

    .url-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .url-icon {
      font-size: 26px;
    }

    .url {
      font-size: 30px;
      color: #d4af37;
      letter-spacing: 1.5px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
    }

    .link-note {
      font-size: 22px;
      color: rgba(255,255,255,0.55);
      margin: 14px 0 0 0;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <p class="hint">
    F12 in Chrome → Elements tab → right-click <code>&lt;div class="post"&gt;</code> → <strong>Capture node screenshot</strong>
  </p>

  <div class="post">
    <img class="bg-photo" src="images/profile-pic.jpg" alt="LaGina Sharp Davis" />
    <div class="overlay"></div>
    <div class="text-block">
      <p class="announcement">laginadavislyrics.com is Live</p>
      <p class="name">LaGina Sharp Davis</p>
      <p class="tagline">Country-Christian Songwriter</p>
      <div class="divider"></div>
      <div class="url-row">
        <span class="url-icon" style="color: #4caf72;">♫</span>
        <span class="url">laginadavislyrics.com</span>
      </div>
      <p class="link-note">🔗 Website link in description</p>
    </div>
  </div>

</body>
</html>
